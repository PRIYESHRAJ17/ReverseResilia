<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReverseResilia — Goal-Driven Supply Chain Recovery</title>
    <meta name="description" content="Recover to a target. And prove it holds. Mathematical optimization and provable supply chain recovery under facility and road network disruptions." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/PPNeueMontreal-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/PPNeueMontrealMono-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/FHPhemister-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dock.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/js/vendor/three/three.module.min.js"
        }
      }
    </script>
    <script type="module" src="/src/dock-mount.tsx"></script>
    <script type="module" src="/js/transition.js"></script>
    <script>
      try {
        var nav = performance.getEntriesByType('navigation')[0];
        var fromSite = document.referrer && new URL(document.referrer).origin === location.origin && new URL(document.referrer).pathname !== location.pathname;
        if (nav && nav.type !== 'reload' && (nav.type === 'back_forward' || fromSite)) document.documentElement.classList.add('is-preloaded');
      } catch (e) {}
    </script>
  </head>
  <body>
    <canvas class="orbit" data-orbit></canvas>
    <canvas class="gl" data-gl></canvas>

    <p class="blend h3 corner corner--tl" data-ui><a href="/" data-home>ReverseResilia</a></p>

    <!-- macOS MagnificationDock (Fluid Spring Navigation) -->
    <div id="dock-root" class="top-dock-container"></div>



    <nav class="blend h3 view-switch" aria-label="View Modes" data-ui data-swap>
      <a class="view-switch-item is-active" href="#" data-view="slider" aria-current="page" title="View 01: Slider">01 SLIDER</a>
      <span aria-hidden="true">||</span>
      <a class="view-switch-item" href="#" data-view="gallery" title="View 02: Gallery Grid">02 GALLERY</a>
      <span aria-hidden="true">||</span>
      <a class="view-switch-item" href="#" data-view="orbit" title="View 03: 3D Orbit">03 ORBIT</a>
    </nav>
    <div class="engine-backdrop" id="engine-backdrop"></div>
    <div data-texts></div>

    <div data-gallery></div>

    <div class="cursor-example" data-cursor aria-hidden="true"></div>

    <div class="blend stepper" data-stepper aria-hidden="true">
      <span class="mono" data-stepper-current>001</span>
      <span class="stepper-steps" data-stepper-steps></span>
      <span class="mono" data-stepper-count>005</span>
    </div>

    <div class="ruler" data-ruler aria-hidden="true">
      <div class="ruler-track" data-ruler-track></div>
    </div>

    <p class="blend h3 corner corner--br" data-ui>&copy;2026 Runtime Rebels</p>

    <div class="work" data-work></div>

    <div class="veil" data-veil></div>

    <div class="load" data-load>
      <div class="load-bg" data-load-bg></div>
      <div class="load-no h3"><div data-load-no>0%</div></div>
    </div>

    <script src="/js/vendor/gsap.min.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
